[project]
name = "stepping-stones-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "alembic",
    "greenlet",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
serve = "app.infrastructure.commands:serve"
migrate = "app.infrastructure.commands:migrate"
test = "app.infrastructure.commands:test"
apply-demo-results = "app.infrastructure.apply_demo_results:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
