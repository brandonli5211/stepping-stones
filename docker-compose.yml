# Starts a Postgres database for local development.
#   docker compose up -d      start it in the background
#   docker compose down       stop it (data is kept in the "pgdata" volume)
#   docker compose down -v    stop it AND wipe all data
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: stepping
      POSTGRES_PASSWORD: stepping
      POSTGRES_DB: stepping_stones
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
